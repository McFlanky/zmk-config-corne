name: Build ZMK firmware

on:
  push:
    paths:
      - 'config/corne.keymap'
  pull_request:
    paths:
      - 'config/corne.keymap'
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  keymap-drawer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      - name: Parse and draw full Corne keymap
        run: |
          keymap -c keymap_drawer.config.yml parse -c 6 -z config/corne.keymap > corne_keymap.yaml
          keymap -c keymap_drawer.config.yml draw corne_keymap.yaml > corne_keymap.svg

      - name: Commit SVG
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update keymap-drawer SVG"
          file_pattern: corne_keymap.svg
