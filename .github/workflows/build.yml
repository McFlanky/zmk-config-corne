name: Build ZMK firmware

on:
  push:
    paths:
      - 'config/corne.keymap'
  pull_request:
    paths:
      - 'config/corne.keymap'
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  keymap-drawer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      - name: Parse and draw full Corne keymap
        run: |
          # Backup previous YAML if it exists
          if [ -f corne_keymap.yaml ]; then
            cp corne_keymap.yaml corne_keymap_backup.yaml
            BASE_ARG="-b corne_keymap.yaml"
          else
            BASE_ARG=""
          fi

          # Parse both halves (6 columns per half)
          keymap parse -c 6 -z config/corne.keymap $BASE_ARG > corne_keymap.yaml

          # Check parse output
          if [ ! -s corne_keymap.yaml ]; then
            echo "Error: parse produced empty YAML"
            exit 1
          fi

          # Draw full keyboard with both halves combined
          keymap draw -c keymap_drawer.config.yaml corne_keymap.yaml \
            --combine-halves left:right \
            --layer-names Base Sym Nav Fun \
            --output corne_keymap.svg

      - name: Commit SVG
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update keymap-drawer SVG"
          file_pattern: corne_keymap.svg
